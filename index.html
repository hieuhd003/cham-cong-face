<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f8">
  <title>Đăng ký khuôn mặt</title>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #946200;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 12px
               max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: clamp(14px, 4vw, 22px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(23px, 6vw, 30px);
      line-height: 1.2;
    }

    label.field-label {
      display: block;
      margin: 12px 0 7px;
      font-size: 16px;
      font-weight: 600;
    }

    select {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd0d6;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      background: #fff;
      color: #222;
    }

    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-top: 14px;
      overflow: hidden;
      isolation: isolate;
      background: #080808;
      border-radius: 16px;
      touch-action: manipulation;
    }

    .camera video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      outline: 0;
      background: #080808;
      /* Ngăn một số trình duyệt tự coi video là trình phát có điều khiển. */
      pointer-events: none;
    }

    .guide {
      position: absolute;
      width: 78%;
      height: 78%;
      left: 11%;
      top: 11%;
      border: 3px solid var(--green);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 0 999px #00000035;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .guide.bad {
      border-color: #ff3b30;
    }

    .guide.ready {
      border-color: #16c45b;
      box-shadow: 0 0 0 999px #00000020, 0 0 18px #16c45b;
    }

    #status {
      margin-top: 14px;
      padding: 13px 12px;
      border-radius: 12px;
      background: #f0f2f5;
      text-align: center;
      line-height: 1.5;
      min-height: 48px;
      overflow-wrap: anywhere;
    }

    #status.good { background: #e8f7ed; color: #087a32; }
    #status.bad { background: #fff0f0; color: #bd2020; }
    #status.wait { background: #fff7df; color: #805b00; }

    .consent {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      line-height: 1.5;
      margin: 16px 2px;
      font-size: 15px;
    }

    .consent input {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
      accent-color: #1677ff;
    }

    button {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #startBtn { background: #111; color: #fff; }
    #stopBtn { background: #e9ecef; color: #222; display: none; }

    .note {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.55;
      color: #626870;
    }

    @media (max-width: 380px) {
      body { padding-left: 8px; padding-right: 8px; }
      .card { padding: 13px; border-radius: 14px; }
      .guide { border-width: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide { transition: none; }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Đăng ký khuôn mặt</h1>

    <label class="field-label" for="employee">Chọn nhân viên</label>
    <select id="employee" autocomplete="off">
      <option value="">Đang tải danh sách...</option>
    </select>

    <div class="camera" id="cameraBox">
      <video
        id="video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        disablepictureinpicture
      ></video>
      <div id="guide" class="guide" aria-hidden="true"></div>
    </div>

    <div id="status" role="status" aria-live="polite">Đang chuẩn bị hệ thống...</div>

    <label class="consent">
      <input type="checkbox" id="agree">
      <span>Tôi đồng ý đăng ký và sử dụng dữ liệu đặc trưng khuôn mặt để xác minh chấm công.</span>
    </label>

    <button id="startBtn" type="button" disabled>MỞ CAMERA VÀ QUÉT</button>
    <button id="stopBtn" type="button">DỪNG CAMERA</button>

    <p class="note">
      Để đăng ký, hãy nhìn thẳng vào camera, đưa toàn bộ khuôn mặt vào trong vòng tròn và giữ yên.
      Không chuyển sang ứng dụng khác trong lúc quét. Nếu camera không mở trong trình duyệt bên trong
      Zalo, hãy mở đường dẫn này bằng Safari hoặc Chrome.
    </p>
  </main>

  <script>
    "use strict";

    const API_URL = "https://script.google.com/macros/s/AKfycbwT0HEx6hAXVCINQIQLqb9ZDX1WZLjnP3vpU1cAgNyJp1W6SZBC8R1K2d__EcSuD5M/exec";
    const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

    const video = document.getElementById("video");
    const cameraBox = document.getElementById("cameraBox");
    const employee = document.getElementById("employee");
    const agree = document.getElementById("agree");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusBox = document.getElementById("status");
    const guide = document.getElementById("guide");

    let stream = null;
    let running = false;
    let modelsReady = false;
    let scanning = false;
    let inspecting = false;
    let stableFrames = 0;
    let lastCenter = null;
    let scanTimer = null;
    let sessionId = 0;

    const FACE_OPTIONS = {
      inputSize: 224,
      scoreThreshold: 0.35
    };

    function detectFaces() {
      return faceapi
        .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions(FACE_OPTIONS))
        .withFaceLandmarks()
        .withFaceDescriptors();
    }

    function say(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function updateStartButton() {
      startBtn.disabled =
        !modelsReady || !agree.checked || !employee.value ||
        running || scanning || employee.disabled;
    }

    agree.addEventListener("change", updateStartButton);
    employee.addEventListener("change", updateStartButton);

    function loadEmployees() {
      return new Promise(function(resolve) {
        const callbackName = "employeeCallback_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let settled = false;

        let timeoutId = null;
        const finish = function(value) {
          if (settled) return;
          settled = true;
          if (timeoutId) clearTimeout(timeoutId);
          delete window[callbackName];
          script.remove();
          resolve(value);
        };

        employee.innerHTML = '<option value="">Đang tải danh sách...</option>';
        updateStartButton();

        window[callbackName] = function(result) {
          try {
            if (!result || !result.success || !Array.isArray(result.data)) {
              throw new Error("Danh sách nhân viên trả về không hợp lệ.");
            }

            employee.innerHTML = '<option value="">-- Chọn nhân viên chưa đăng ký --</option>';

            result.data.forEach(function(item) {
              const option = document.createElement("option");
              option.value = item.maNV;
              option.textContent = item.maNV + " - " + item.hoTen;
              employee.appendChild(option);
            });

            employee.value = "";
            updateStartButton();

            if (result.data.length === 0) {
              say("Tất cả nhân viên đã đăng ký khuôn mặt.", "good");
            } else {
              say("Còn " + result.data.length + " nhân viên chưa đăng ký khuôn mặt.");
            }

            finish(true);
          } catch (err) {
            say("Lỗi danh sách: " + err.message, "bad");
            finish(false);
          }
        };

        script.onerror = function() {
          say("Không tải được danh sách nhân viên. Hãy kiểm tra kết nối.", "bad");
          finish(false);
        };

        script.src = API_URL + "?action=employees&callback=" +
          encodeURIComponent(callbackName) + "&t=" + Date.now();

        // Tránh yêu cầu bị treo vô hạn nếu JSONP không phản hồi.
        timeoutId = setTimeout(function() {
          if (!settled) {
            say("Máy chủ chưa phản hồi danh sách. Hãy tải lại trang và thử lại.", "bad");
            finish(false);
          }
        }, 15000);
        document.body.appendChild(script);
      });
    }

    async function loadModels() {
  try {
    if (!window.faceapi) {
      throw new Error("Không tải được thư viện nhận diện khuôn mặt.");
    }

    say("Đang tải mô hình nhận diện...");

    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);

    modelsReady = true;
    updateStartButton();

    say(
      "Đã tải mô hình thành công. Chọn nhân viên, tích đồng ý và mở camera."
    );
  } catch (err) {
    modelsReady = false;
    updateStartButton();

    say(
      "Lỗi tải mô hình: " + (err.message || err),
      "bad"
    );

    console.error("Lỗi loadModels:", err);
  }
}

    // Chuyển tọa độ ảnh video sang vị trí hiển thị khi object-fit: cover.
    function videoBox() {
      const rect = video.getBoundingClientRect();
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (!vw || !vh || !rect.width || !rect.height) {
        return { left: rect.left, top: rect.top, width: rect.width, height: rect.height, scale: 1 };
      }

      const scale = Math.max(rect.width / vw, rect.height / vh);
      const width = vw * scale;
      const height = vh * scale;

      return {
        left: rect.left + (rect.width - width) / 2,
        top: rect.top + (rect.height - height) / 2,
        width,
        height,
        scale
      };
    }

    function faceInsideCircle(box) {
      const guideRect = guide.getBoundingClientRect();
      const centerX = guideRect.left + guideRect.width / 2;
      const centerY = guideRect.top + guideRect.height / 2;
      const radius = guideRect.width / 2;

      const points = [
        [box.left, box.top], [box.right, box.top],
        [box.left, box.bottom], [box.right, box.bottom]
      ];

      return points.every(function(point) {
        const dx = point[0] - centerX;
        const dy = point[1] - centerY;
        return Math.hypot(dx, dy) <= radius;
      });
    }

    function checkFrontal(landmarks, faceBox) {
      const p = landmarks.positions;
      const avg = function(indices) {
        let x = 0, y = 0;
        indices.forEach(function(i) { x += p[i].x; y += p[i].y; });
        return { x: x / indices.length, y: y / indices.length };
      };

      const leftEye = avg([36, 37, 38, 39, 40, 41]);
      const rightEye = avg([42, 43, 44, 45, 46, 47]);
      const nose = avg([30, 31, 32, 33, 34, 35]);
      const eyeMidX = (leftEye.x + rightEye.x) / 2;
      const eyeMidY = (leftEye.y + rightEye.y) / 2;
      const eyeDistance = Math.abs(rightEye.x - leftEye.x);

      if (eyeDistance < 1 || !faceBox.width || !faceBox.height) {
        return { ok: false, reason: "Không thấy rõ hai mắt. Hãy nhìn thẳng camera." };
      }

      const yawOffset = Math.abs(nose.x - eyeMidX) / faceBox.width;
      const rollOffset = Math.abs(leftEye.y - rightEye.y) / eyeDistance;

      if (yawOffset > 0.09) {
        return { ok: false, reason: "Hãy quay mặt thẳng vào camera, không nhìn lệch." };
      }
      if (rollOffset > 0.16) {
        return { ok: false, reason: "Hãy giữ đầu thẳng, không nghiêng." };
      }

      const eyePosition = (eyeMidY - faceBox.top) / faceBox.height;
      if (eyePosition < 0.18 || eyePosition > 0.52) {
        return { ok: false, reason: "Hãy nhìn thẳng và giữ đầu ở tư thế tự nhiên." };
      }

      return { ok: true };
    }

    function resetStability() {
      stableFrames = 0;
      lastCenter = null;
      guide.classList.remove("ready", "bad");
    }

    async function inspectFrame() {
      if (!running || scanning || inspecting || video.readyState < 2 || !video.videoWidth) return;
      inspecting = true;
      const thisSession = sessionId;

      try {
        const detections = await detectFaces();
        if (!running || thisSession !== sessionId) return;

        if (detections.length === 0) {
          resetStability();
          guide.classList.add("bad");
          say("Chưa thấy khuôn mặt. Hãy nhìn thẳng vào camera.", "wait");
          return;
        }

        if (detections.length > 1) {
          resetStability();
          guide.classList.add("bad");
          say("Chỉ để một người trong khung hình.", "bad");
          return;
        }

        const result = detections[0];
        const b = result.detection.box;
        const vb = videoBox();
        const faceBox = {
          left: vb.left + b.x * vb.scale,
          top: vb.top + b.y * vb.scale,
          right: vb.left + (b.x + b.width) * vb.scale,
          bottom: vb.top + (b.y + b.height) * vb.scale,
          width: b.width,
          height: b.height
        };

        if (!faceInsideCircle(faceBox)) {
          resetStability();
          guide.classList.add("bad");
          say("Đưa toàn bộ khuôn mặt vào trong vòng tròn.", "wait");
          return;
        }

        const frontal = checkFrontal(result.landmarks, b);
        if (!frontal.ok) {
          resetStability();
          guide.classList.add("bad");
          say(frontal.reason, "wait");
          return;
        }

        const centerX = (b.x + b.width / 2) / video.videoWidth;
        const centerY = (b.y + b.height / 2) / video.videoHeight;

        if (lastCenter) {
          const movement = Math.hypot(centerX - lastCenter.x, centerY - lastCenter.y);
          if (movement > 0.03) {
            resetStability();
            guide.classList.add("bad");
            say("Hãy giữ yên khuôn mặt và nhìn thẳng camera.", "wait");
            return;
          }
        }

        lastCenter = { x: centerX, y: centerY };
        stableFrames++;
        guide.classList.remove("bad");
        guide.classList.add("ready");

        const needed = 10;
        if (stableFrames < needed) {
          say("Đúng tư thế. Giữ yên... " + stableFrames + "/" + needed, "good");
          return;
        }

        await captureStableFace();
      } catch (err) {
        if (running && thisSession === sessionId) {
          resetStability();
          say("Lỗi khi quét: " + err.message, "bad");
        }
      } finally {
        inspecting = false;
      }
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function captureStableFace() {
      if (scanning || !running) return;
      scanning = true;
      updateStartButton();
      const thisSession = sessionId;
      const descriptors = [];

      say("Đang ghi nhận khuôn mặt. Hãy tiếp tục nhìn thẳng và giữ yên...", "good");

      try {
        for (let i = 0; i < 4; i++) {
          if (!running || thisSession !== sessionId) throw new Error("Đã dừng camera.");

          const detections = await detectFaces();
          if (detections.length !== 1) {
            throw new Error("Không nhận diện ổn định được khuôn mặt. Hãy quét lại.");
          }

          const d = detections[0];
          const b = d.detection.box;
          const vb = videoBox();
          const mapped = {
            left: vb.left + b.x * vb.scale,
            top: vb.top + b.y * vb.scale,
            right: vb.left + (b.x + b.width) * vb.scale,
            bottom: vb.top + (b.y + b.height) * vb.scale
          };

          if (!faceInsideCircle(mapped)) throw new Error("Khuôn mặt ra khỏi vòng tròn. Hãy quét lại.");
          const frontal = checkFrontal(d.landmarks, b);
          if (!frontal.ok) throw new Error(frontal.reason);

          descriptors.push(Array.from(d.descriptor));
          await wait(250);
        }

        for (let i = 1; i < descriptors.length; i++) {
          let sum = 0;
          for (let j = 0; j < 128; j++) {
            const diff = descriptors[i][j] - descriptors[0][j];
            sum += diff * diff;
          }
          if (Math.sqrt(sum) > 0.50) {
            throw new Error("Khuôn mặt chưa ổn định. Hãy nhìn thẳng và quét lại.");
          }
        }

        const average = new Array(128).fill(0);
        descriptors.forEach(desc => desc.forEach((value, i) => {
          average[i] += value / descriptors.length;
        }));

        stopCamera();
        say("Đang gửi dữ liệu đăng ký...", "good");
        await sendFaceData(average);
      } catch (err) {
        if (running && thisSession === sessionId) {
          scanning = false;
          resetStability();
          say(err.message + " Hãy đặt lại khuôn mặt vào vòng tròn.", "bad");
          updateStartButton();
        }
      }
    }

    async function sendFaceData(descriptor) {
      const maNV = employee.value;
      const body = {
        action: "registerFace",
        maNV: maNV,
        faceId: "FACE_" + maNV,
        faceData: JSON.stringify(descriptor)
      };

      startBtn.disabled = true;
      employee.disabled = true;

      try {
        // no-cors không cho đọc phản hồi; cần kiểm tra Sheets để xác nhận đã ghi thành công.
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body)
        });

        say("Đã gửi yêu cầu đăng ký. Đang cập nhật danh sách...", "wait");
        await wait(1800);
        const refreshed = await loadEmployees();
        employee.disabled = false;

        if (refreshed) {
          say("Đã gửi yêu cầu. Hãy kiểm tra Google Sheets để xác nhận dữ liệu đã được ghi.", "good");
        } else {
          say("Đã gửi yêu cầu nhưng chưa tải lại được danh sách. Hãy kiểm tra Google Sheets.", "wait");
        }
      } catch (err) {
        employee.disabled = false;
        say("Không gửi được dữ liệu: " + err.message, "bad");
      } finally {
        scanning = false;
        updateStartButton();
      }
    }

    async function startCamera() {
      if (!agree.checked) {
        say("Bạn cần tích đồng ý trước khi mở camera.", "bad");
        return;
      }
      if (!employee.value) {
        say("Vui lòng chọn nhân viên trước.", "bad");
        return;
      }
      if (!modelsReady) {
        say("Mô hình chưa sẵn sàng. Vui lòng đợi.", "wait");
        return;
      }
      if (running) return;

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Trình duyệt không hỗ trợ camera. Hãy mở bằng Safari hoặc Chrome.");
        }

        const newStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "user" },
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 20, max: 24 }
          }
        });

        stream = newStream;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.removeAttribute("controls");
        video.playsInline = true;
        video.muted = true;
        video.srcObject = stream;

        await video.play();

        sessionId++;
        running = true;
        scanning = false;
        inspecting = false;
        resetStability();

        startBtn.style.display = "none";
        stopBtn.style.display = "block";
        say("Đưa toàn bộ khuôn mặt vào vòng tròn, nhìn thẳng và giữ yên.", "wait");

        if (scanTimer) clearInterval(scanTimer);
        scanTimer = setInterval(inspectFrame, 350);
        updateStartButton();
      } catch (err) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        video.srcObject = null;
        say("Không mở được camera. Hãy cấp quyền camera và thử bằng Safari/Chrome. " + err.message, "bad");
        updateStartButton();
      }
    }

    function stopCamera() {
      sessionId++;
      running = false;
      inspecting = false;
      scanning = false;

      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.pause();
      video.srcObject = null;
      startBtn.style.display = "block";
      stopBtn.style.display = "none";
      resetStability();
      updateStartButton();
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", function() {
      stopCamera();
      say("Đã dừng camera.");
    });

    // Nếu trang bị ẩn, dừng camera để tránh luồng treo; người dùng có thể bấm mở lại.
    document.addEventListener("visibilitychange", function() {
      if (document.hidden && running) {
        stopCamera();
        say("Camera đã tạm dừng khi rời trang. Quay lại và bấm MỞ CAMERA VÀ QUÉT.", "wait");
      }
    });

    loadEmployees();
    loadModels();
  </script>
</body>
</html>
