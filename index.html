
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký khuôn mặt</title>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#222}
.card{max-width:480px;margin:24px auto;background:white;padding:20px;border-radius:18px;box-shadow:0 5px 25px #0001}
h2{text-align:center;margin:0 0 18px}
label{display:block;margin:12px 0 8px}
select,button{width:100%;padding:15px;border-radius:10px;font-size:16px}
select{border:1px solid #ccc;background:white}
video{width:100%;display:block;transform:scaleX(-1);border-radius:12px;background:#111}
.camera{position:relative;margin:16px 0;overflow:hidden;border-radius:12px;min-height:220px;background:#111}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.oval{width:60%;height:75%;border:3px solid #22c55e;border-radius:50%}
#hint{position:absolute;bottom:10px;left:8px;right:8px;text-align:center;color:white;background:#0009;padding:9px;border-radius:8px;font-size:14px}
button{border:0;background:#111;color:white;font-weight:bold;margin-top:12px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#start{background:#111}
#status{margin:14px 0;padding:13px;border-radius:10px;background:#f1f3f5;text-align:center;line-height:1.5}
#consent{display:flex;gap:10px;align-items:flex-start;line-height:1.5;margin-top:15px}
#consent input{margin-top:5px}
.note{font-size:12px;color:#666;line-height:1.5;margin-top:14px}
.success{background:#e7f7ed!important;color:#087b35}
.error{background:#fff0f0!important;color:#b42318}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h2>Đăng ký khuôn mặt</h2>

  <label for="employee">Chọn nhân viên</label>
  <select id="employee">
    <option value="">Đang tải nhân viên...</option>
  </select>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="guide"><div class="oval"></div></div>
    <div id="hint">Đồng ý và bấm MỞ CAMERA để bắt đầu</div>
  </div>

  <div id="status">Vui lòng chọn nhân viên và đọc thông tin đăng ký.</div>

  <label id="consent">
    <input type="checkbox" id="agree">
    <span>Tôi đồng ý đăng ký và sử dụng dữ liệu đặc trưng khuôn mặt để xác minh chấm công.</span>
  </label>

  <button id="start" disabled>MỞ CAMERA VÀ QUÉT</button>
  <button id="retry" class="hidden">QUÉT LẠI</button>

  <div class="note">
    Camera chỉ bật sau khi bạn tích đồng ý và bấm mở camera.
    Khi quét xong, camera sẽ tự tắt. Kết quả đăng ký được kiểm tra
    lại với hệ thống trước khi thông báo thành công.
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwT0HEx6hAXVCINQIQLqb9ZDX1WZLjnP3vpU1cAgNyJp1W6SZBC8R1K2d__EcSuD5M/exec";
const MODEL_URL =
  "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights";

const employee = document.getElementById("employee");
const agree = document.getElementById("agree");
const startBtn = document.getElementById("start");
const retryBtn = document.getElementById("retry");
const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const hint = document.getElementById("hint");

let stream = null;
let busy = false;
let modelsReady = false;

function setStatus(text, type="") {
  statusBox.textContent = text;
  statusBox.className = type;
}
function updateButton() {
  startBtn.disabled = !agree.checked || !employee.value || busy;
}
agree.addEventListener("change", () => {
  updateButton();
  if (!agree.checked) {
    stopCamera();
    setStatus("Bạn cần đồng ý trước khi mở camera.");
  }
});
employee.addEventListener("change", updateButton);

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "faceCb" + Date.now() + Math.floor(Math.random()*10000);
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Hệ thống không phản hồi."));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }
    window[cb] = data => {
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error("Không kết nối được Google Apps Script."));
    };
    script.src = url + (url.includes("?") ? "&" : "?") +
      "callback=" + cb;
    document.body.appendChild(script);
  });
}

async function loadEmployees() {
  try {
    const data = await jsonp(API_URL + "?action=employees");
    if (!data.success) throw new Error(data.message || "Không tải được nhân viên");
    employee.innerHTML = '<option value="">-- Chọn nhân viên --</option>';
    data.data.forEach(nv => {
      const opt = document.createElement("option");
      opt.value = nv.maNV;
      opt.textContent = nv.maNV + " - " + nv.hoTen;
      employee.appendChild(opt);
    });
    setStatus("Đã tải danh sách nhân viên. Hãy chọn người cần đăng ký.");
  } catch (e) {
    employee.innerHTML = '<option value="">Lỗi tải danh sách</option>';
    setStatus(e.message, "error");
  }
}

async function loadModels() {
  if (modelsReady) return;
  setStatus("Đang tải bộ nhận diện khuôn mặt...");
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsReady = true;
}

async function scanFace() {
  if (!agree.checked) {
    setStatus("Bạn cần tích đồng ý trước khi mở camera.", "error");
    return;
  }
  if (!employee.value || busy) return;

  busy = true;
  updateButton();
  retryBtn.classList.add("hidden");

  try {
    await loadModels();
    setStatus("Đang mở camera...");
    hint.textContent = "Đưa khuôn mặt vào giữa khung";

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: {ideal: 640}, height: {ideal: 480} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    setStatus("Đang tìm khuôn mặt. Nhìn thẳng vào camera và giữ yên.");
    const samples = [];
    let attempts = 0;

    while (samples.length < 3 && attempts < 45) {
      attempts++;
      const result = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({
          inputSize: 320, scoreThreshold: 0.55
        }))
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (result) {
        const box = result.detection.box;
        const videoWidth = video.videoWidth || 640;
        const ratio = box.width / videoWidth;

        if (ratio < 0.18) {
          hint.textContent = "Đưa mặt lại gần camera một chút";
        } else if (ratio > 0.75) {
          hint.textContent = "Lùi ra xa camera một chút";
        } else {
          samples.push(Array.from(result.descriptor));
          hint.textContent = "Đã quét " + samples.length + "/3. Giữ yên nhé";
        }
      } else {
        hint.textContent = "Chưa thấy rõ mặt. Hãy nhìn thẳng và đủ sáng";
      }
      await new Promise(r => setTimeout(r, 650));
    }

    if (samples.length < 3) {
      throw new Error("Chưa quét đủ mẫu. Hãy thử lại ở nơi đủ sáng.");
    }

    // Trung bình 3 mẫu đặc trưng
    const avg = samples[0].map((_, i) =>
      samples.reduce((sum, sample) => sum + sample[i], 0) / samples.length
    );

    // Tắt camera ngay sau khi hoàn tất quét
    stopCamera();
    hint.textContent = "Đã quét xong";
    setStatus("Đã quét xong. Đang gửi dữ liệu đăng ký...");

    const maNV = employee.value;
    const payload = {
      action: "registerFace",
      maNV: maNV,
      faceId: "FACE_" + maNV,
      faceData: JSON.stringify(avg)
    };

    // Gửi dạng text/plain để tránh preflight; phản hồi POST sẽ không đọc trực tiếp được.
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    setStatus("Đã gửi dữ liệu. Đang xác nhận trong Google Sheets...");
    let confirmed = false;

    // Kiểm tra lại dữ liệu đã được ghi vào Sheet chưa
    for (let i = 0; i < 8; i++) {
      await new Promise(r => setTimeout(r, 1800));
      const check = await jsonp(
        API_URL + "?action=faceStatus&maNV=" + encodeURIComponent(maNV)
      );
      if (check.success && check.registered) {
        confirmed = true;
        break;
      }
    }

    if (!confirmed) {
      throw new Error("Chưa xác nhận được dữ liệu trong Sheet. Hãy kiểm tra FACE_ID và FACE_DATA trước khi đăng ký lại.");
    }

    setStatus("ĐĂNG KÝ KHUÔN MẶT THÀNH CÔNG!", "success");
    hint.textContent = "Hoàn tất";
  } catch (e) {
    stopCamera();
    setStatus(e.message || "Có lỗi xảy ra.", "error");
    hint.textContent = "Bạn có thể thử quét lại";
    retryBtn.classList.remove("hidden");
  } finally {
    busy = false;
    updateButton();
  }
}

startBtn.addEventListener("click", scanFace);
retryBtn.addEventListener("click", scanFace);

loadEmployees();
</script>
</body>
</html>
